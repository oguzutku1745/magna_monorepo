<!doctype html>
<!-- Social card 1200x630 CSS (rendered at 2x). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1200px; height: 630px; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { margin-bottom: 40px; }
  #field { position: absolute; inset: 0; }
  .top, .bottom { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { position: relative; z-index: 2; font-size: 84px; font-weight: 500; letter-spacing: -0.05em; line-height: 0.95; max-width: 640px; }
</style></head>
<body>
  <div class="canvas">
    <div id="field"></div>
    <div class="top"><img src="../logo/wordmark.svg" style="height:30px" alt=""><span class="label">Private credentials on Aztec</span></div>
    <h1>Prove who you are. Reveal nothing else.</h1>
  </div>
  <script type="module">
    import { ready } from "./ready.js";
    import { createSealField } from "./ascii-field.js";
    createSealField(document.getElementById("field"), { shape: "mark", progress: 1, markBox: { x: 0.79, y: 0.5, size: 0.66 } });
    await new Promise((r) => setTimeout(r, 400));
    ready();
  </script>
</body></html>
